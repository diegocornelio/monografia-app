name: publicar no cloudflare pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-producao
  cancel-in-progress: false

jobs:
  publicar:
    name: portoes e publicacao
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Nenhum artefato vai ao ar sem os portoes do MARCO_PUBLICACAO_V1 §4.
      - name: especificacao sem vermelho
        run: node testes/tdd.mjs --silencioso
      - name: nenhuma feature do catalogo sem teste
        run: node testes/cobertura.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run teste:unit
      - name: conferir variaveis publicas do supabase
        run: |
          test -n "${VITE_SUPABASE_URL}"
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}"
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 448ac53f4ad71e4650211b5b0bf0991a
          command: pages deploy dist --project-name=fichario --branch=main
