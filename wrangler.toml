# Configuracao do Cloudflare Pages versionada no repositorio, para que o painel
# nao seja a unica fonte de verdade. Nenhuma Function e declarada de proposito:
# o Fichario Solo e estatico, e e isso que mantem a hospedagem sem medidor.
name = "fichario"
compatibility_date = "2026-09-07"
pages_build_output_dir = "dist"
